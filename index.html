<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For SNO Famakinwa</title>
    <style>
        :root {
            --parchment-bg: #e6d3a7;
            --ink-color: #2c1e14;
            --gold: #c39b33;
            --burgundy: #740001;
        }

        body {
            margin: 0;
            padding: 0;
            background: #5B1B1C;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            color: white;
        }

        /* Introduction & Countdown Styling */
        #intro-overlay {
            position: absolute;
            z-index: 100;
            text-align: center;
            width: 80%;
        }

        #intro-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-style: italic;
            line-height: 1.5;
        }

        #countdown {
            font-size: 4rem;
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(195, 155, 51, 0.6);
        }

        /* Parchment Scroll Design (Hidden initially) */
        #scroll-container {
            display: none;
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 360px;
            min-height: 480px;
            background: var(--parchment-bg);
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            padding: 45px 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7), inset 0 0 60px rgba(101, 67, 33, 0.3);
            border: 1px solid #5d4037;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .hogwarts-crest {
            width: 80px;
            margin-bottom: 20px;
        }

        .question-text {
            color: var(--ink-color);
            font-size: 1.35rem;
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: var(--burgundy);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 28px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Animations */
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        .fade-in {
            animation: fadeIn 1.5s forwards;
        }

        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div id="intro-text">Hi, SNO Famakinwa, I have a few questions for you...</div>
        <div id="countdown"></div>
    </div>

    <div id="scroll-container">
        <img src="https://www.pngkit.com/png/full/41-419131_hogwarts-logo-png-hogwarts-crest-transparent-background.png" alt="Hogwarts Crest" class="hogwarts-crest">
        <div class="question-text" id="question">Preparing the parchment...</div>
        <button onclick="nextQuestion()" id="btn">Next Question →</button>
    </div>

    <script>
        const questions = [
            "What was your very first impression of me, Orobola?",
            "If we could teleport anywhere in the world for a date right now, where would we go?",
            "What is a small thing I do that makes you smile?",
            "What is your favorite memory of us so far?",
            "If you had to describe our 'vibe' in only three words, what would they be?",
            "What is one thing you've always wanted to try but haven't yet?",
            "Final question: Can I take you out again soon? ✨"
        ];

        let currentIdx = -1;
        const countdownElement = document.getElementById('countdown');
        const introOverlay = document.getElementById('intro-overlay');
        const scrollContainer = document.getElementById('scroll-container');

        // Initial Countdown Logic
        let count = 5;
        const timer = setInterval(() => {
            if (count > 0) {
                countdownElement.innerText = count;
                count--;
            } else {
                clearInterval(timer);
                startMagicalReveal();
            }
        }, 1000);

        function startMagicalReveal() {
            introOverlay.classList.add('fade-out');
            setTimeout(() => {
                introOverlay.style.display = 'none';
                scrollContainer.style.display = 'flex';
                scrollContainer.classList.add('fade-in');
                nextQuestion(); // Show first question automatically
            }, 1000);
        }

        function nextQuestion() {
            const qElement = document.getElementById('question');
            const btn = document.getElementById('btn');

            currentIdx++;

            if (currentIdx < questions.length) {
                // Flash animation for text change
                qElement.style.opacity = 0;
                setTimeout(() => {
                    qElement.innerText = questions[currentIdx];
                    qElement.style.opacity = 1;
                }, 300);
            } else {
                qElement.innerText = "You're amazing, Orobola. Mischief Managed. ❤️";
                btn.style.display = "none";
            }
        }
    </script>
</body>
</html>
