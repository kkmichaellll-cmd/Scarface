<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owl Post for Orobola</title>
    <style>
        :root {
            --parchment-bg: #e6d3a7;
            --ink-color: #2c1e14;
            --gold: #c39b33;
            --burgundy: #740001;
        }

        body {
            margin: 0;
            padding: 0;
            background: #5b1b1c; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Subtle Dark Magic Background */
        .magic-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: radial-gradient(circle, #2a2a2a 0%, #000000 100%); */
            background: #5b1b1c;
            z-index: 1;
        }

        /* Parchment Scroll Design */
        #scroll-container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 360px;
            min-height: 480px;
            background: var(--parchment-bg);
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            border-radius: 2px;
            padding: 45px 25px;
            box-shadow: 
                0 0 40px rgba(0,0,0,0.7),
                inset 0 0 60px rgba(101, 67, 33, 0.3);
            border: 1px solid #5d4037;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Hogwarts Logo */
        .hogwarts-crest {
            width: 80px;
            height: 80px;
            border-radius: 999999;
            overflow: hidden;
            margin-bottom: 20px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .question-text {
            color: var(--ink-color);
            font-size: 1.35rem;
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #8d6e63;
            position: absolute;
            top: 20px;
        }

        button {
            background: var(--burgundy);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 28px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        button:active {
            transform: scale(0.95);
            background: #5a0001;
        }

        /* Ink Reveal Animation */
        .reveal {
            animation: inkFade 1s ease-in-out forwards;
        }

        @keyframes inkFade {
            from { opacity: 0; filter: blur(4px); }
            to { opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body>

    <div class="magic-layer"></div>

    <div id="scroll-container">
        <div class="progress" id="progress">SCARFACE</div>
        
        <img src="./Hogwarts.jpg" 
             alt="Hogwarts Crest" 
             class="hogwarts-crest">

        <div class="question-text reveal" id="question">
            Hi Orobola, I have a few lovely questions for you...
        </div>
        
        <button onclick="nextQuestion()" id="btn">Begin Secret</button>
    </div>

    <script>
        const questions = [
            "What was your very first impression of me, Orobola?",
            "If we could teleport anywhere in the world for a date right now, where would we go?",
            "What is a small thing I do that makes you smile?",
            "What is your favorite memory of us so far?",
            "If you had to describe our 'vibe' in only three words, what would they be?",
            "What is one thing you've always wanted to try but haven't yet?",
            "Final question: Can I take you out again soon? ✨"
        ];

        let currentIdx = -1;

        function nextQuestion() {
            const qElement = document.getElementById('question');
            const pElement = document.getElementById('progress');
            const btn = document.getElementById('btn');
            const container = document.getElementById('scroll-container');

            // Reset animation
            qElement.classList.remove('reveal');
            void qElement.offsetWidth; 
            qElement.classList.add('reveal');

            currentIdx++;

            if (currentIdx < questions.length) {
                qElement.innerText = questions[currentIdx];
                pElement.innerText = "Scroll No. " + (currentIdx + 1);
                btn.innerText = "Next Question →";
            } else {
                qElement.innerText = "You're amazing, Orobola. Mischief Managed. ❤️";
                pElement.innerText = "The End";
                btn.style.display = "none";
            }
        }
    </script>
</body>
</html>
